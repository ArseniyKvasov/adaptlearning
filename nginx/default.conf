server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index template.html;

    location = / {
        try_files /template.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
